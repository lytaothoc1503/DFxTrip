name: Xuất bản website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy bản trang tĩnh
        uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Đóng gói
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đăng lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
